apiVersion: v1
kind: Service
metadata:
  name: eks-app-service
  namespace: eks-app
spec:
  # ClusterIP because the ALB Ingress Controller targets pod IPs directly
  # (target-type: ip in the Ingress below) — no NodePort needed.
  type: ClusterIP
  selector:
    app: eks-app
  ports:
    - port: 80
      targetPort: 3000
